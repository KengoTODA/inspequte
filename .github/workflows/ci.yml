name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  java-26-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
      - name: Setup Java 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '26'
      - name: Build inspequte
        run: cargo build --release
      - name: Verify Java 26 class-file compatibility
        run: bash scripts/test-java-compatibility.sh 26 70
      - name: Upload Java 26 compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: java-26-compatibility
          path: target/java-compatibility/java-26/
          if-no-files-found: error

  gradle-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
      - name: Install the release binary
        run: |
          cargo build --release
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build and test Gradle plugin
        run: ./gradlew build --no-daemon
        working-directory: gradle-plugin
      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gradle-plugin-reports
          path: gradle-plugin/build/reports
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gradle-plugin/build/reports/jacoco/test/jacocoTestReport.xml
          flags: gradle-plugin
          fail_ci_if_error: true
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
      - name: Build
        run: cargo build --release
      - name: Test rule-authoring evidence contracts
        run: |
          python3 tests/test_rule_authoring_evidence.py
          python3 tests/test_rule_authoring_verification.py
      - name: Test and compute coverage
        run: bash scripts/coverage.sh
      - name: Smoke test (SpotBugs jars)
        run: bash scripts/smoke-spotbugs.sh
      - name: Verify vendored OASIS SARIF schema
        run: bash scripts/update-sarif-schema.sh --check
      - name: Generate inspequte SARIF compatibility report
        run: |
          # Generate a finding with codeFlows and relatedLocations so the GitHub
          # Code Scanning canary verifies evidence ingestion, not only empty SARIF.
          mkdir -p target/sarif-compatibility-source target/sarif-compatibility-input
          cat > target/sarif-compatibility-source/ClassA.java <<'JAVA'
          public class ClassA {
              public void methodX() {
                  try {
                      throw new Exception("one");
                  } catch (Exception varOne) {
                      throw new RuntimeException("two");
                  }
              }
          }
          JAVA
          javac -d target/sarif-compatibility-input \
            target/sarif-compatibility-source/ClassA.java
          target/release/inspequte \
            --input target/sarif-compatibility-input \
            --output target/inspequte-compatibility.sarif \
            --automation-details-id inspequte/schema-compatibility
        env:
          INSPEQUTE_VALIDATE_SARIF: 1
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-artifacts
          path: target/release/
          if-no-files-found: warn
      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-reports
          path: target/coverage/**
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/lcov.info
          flags: cli
          fail_ci_if_error: true
      - name: Upload smoke test logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-test-logs
          path: target/smoketest/*.log
          if-no-files-found: warn
      - name: Generate SARIF and SBOM report
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

          cargo audit --format sarif > target/audit.sarif
        env:
          INSPEQUTE_VALIDATE_SARIF: 1
      - name: Upload SARIF report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cargo-audit-sarif
          path: target/audit.sarif
          if-no-files-found: warn
      - name: Upload inspequte SARIF compatibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: inspequte-sarif-compatibility
          path: target/inspequte-compatibility.sarif
          if-no-files-found: error
  gradle-dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
      - name: Generate and submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          build-root-directory: gradle-plugin

  upload-code-scanning-sarif:
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: cli
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download SARIF report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cargo-audit-sarif
          path: target
      - name: Download inspequte SARIF compatibility report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: inspequte-sarif-compatibility
          path: target
      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: target/audit.sarif
      - name: Upload inspequte SARIF compatibility canary
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: target/inspequte-compatibility.sarif
          category: inspequte/schema-compatibility
