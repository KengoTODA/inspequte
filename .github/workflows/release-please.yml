name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      rust_release_created: ${{ steps.release.outputs.release_created }}
      rust_tag_name: ${{ steps.release.outputs.tag_name }}
      rust_sha: ${{ steps.release.outputs.sha }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      prs: ${{ steps.release.outputs.prs }}
      gradle_plugin_release_created: ${{ steps.release.outputs['gradle-plugin--release_created'] }}
      gradle_plugin_tag_name: ${{ steps.release.outputs['gradle-plugin--tag_name'] }}
      gradle_plugin_sha: ${{ steps.release.outputs['gradle-plugin--sha'] }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  build-release-binaries:
    needs: release-please
    if: needs.release-please.outputs.rust_release_created == 'true'
    uses: ./.github/workflows/build-cli-release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      release-tag: ${{ needs.release-please.outputs.rust_tag_name }}
      release-sha: ${{ needs.release-please.outputs.rust_sha }}

  benchmark-release-jaeger:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' || needs.release-please.outputs.rust_release_created == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      rust_pr_number: ${{ steps.resolve-pr.outputs.pr_number }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Start Jaeger, run spotbugs.jar benchmark, export trace
        id: bench
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p target/bench/jaeger-debug
          bench_log="target/bench/bench-workflow.log"

          .codex/skills/jaeger-spotbugs-benchmark/scripts/start-jaeger.sh
          .codex/skills/jaeger-spotbugs-benchmark/scripts/run-bench-spotbugs-with-otel.sh 1 \
            2>&1 | tee "${bench_log}"

          trace_id="$(sed -n 's/^trace-id=//p' "${bench_log}" | tail -n 1)"
          if [[ -n "${trace_id}" ]]; then
            echo "Resolved trace ID from benchmark output: ${trace_id}"
          else
            echo "Benchmark output did not include trace-id; falling back to latest trace query."
          fi

          trace_json=""
          for attempt in $(seq 1 20); do
            export_args=()
            if [[ -n "${trace_id}" ]]; then
              export_args+=("${trace_id}")
            fi
            if trace_json="$(
              .codex/skills/jaeger-spotbugs-benchmark/scripts/export-jaeger-trace.sh "${export_args[@]}" \
                2>"target/bench/jaeger-debug/export-attempt-${attempt}.stderr"
            )"; then
              break
            fi
            curl -fsSL "http://localhost:16686/api/services" \
              -o "target/bench/jaeger-debug/services-attempt-${attempt}.json" || true
            curl -fsSL "http://localhost:16686/api/traces?service=inspequte&limit=20&lookback=1h" \
              -o "target/bench/jaeger-debug/query-attempt-${attempt}.json" || true
            sleep 3
          done

          if [[ -z "${trace_json}" || ! -f "${trace_json}" ]]; then
            echo "Failed to export Jaeger trace JSON after benchmark run."
            exit 1
          fi

          trace_id="$(basename "${trace_json}" .json)"
          trace_id="${trace_id#jaeger-trace-}"

          npm install --ignore-scripts --no-save --no-package-lock playwright@1.53.0
          ./node_modules/.bin/playwright install --with-deps chromium
          screenshot_png="$(node scripts/capture-jaeger-trace-screenshot.mjs "${trace_id}")"

          .codex/skills/jaeger-spotbugs-benchmark/scripts/analyze-trace-json.sh "${trace_json}" \
            | tee target/bench/analyze-trace.log

          summary_json="${trace_json%.json}.summary.json"
          if [[ ! -f "${summary_json}" ]]; then
            echo "Summary JSON was not generated: ${summary_json}"
            exit 1
          fi

          slowest_rule_id="$(jq -r '.slowest_rule.id // ""' "${summary_json}")"
          slowest_rule_total_ms="$(jq -r '.slowest_rule.total_duration_ms // 0' "${summary_json}")"
          slowest_rule_count="$(jq -r '.slowest_rule.span_count // 0' "${summary_json}")"
          slowest_jar_id="$(jq -r '.slowest_jar.id // ""' "${summary_json}")"
          slowest_jar_total_ms="$(jq -r '.slowest_jar.total_duration_ms // 0' "${summary_json}")"
          slowest_jar_count="$(jq -r '.slowest_jar.span_count // 0' "${summary_json}")"
          slowest_class_id="$(jq -r '.slowest_class.id // ""' "${summary_json}")"
          slowest_class_total_ms="$(jq -r '.slowest_class.total_duration_ms // 0' "${summary_json}")"
          slowest_class_count="$(jq -r '.slowest_class.span_count // 0' "${summary_json}")"

          report_md="target/bench/benchmark-report.md"
          {
            echo "## Bottleneck Report"
            echo "- Trace ID: ${trace_id}"
            echo "- Screenshot: ${screenshot_png}"
            echo "- Slowest rule: ${slowest_rule_id} (${slowest_rule_total_ms} ms total across ${slowest_rule_count} spans)"
            echo "- Slowest jar: ${slowest_jar_id} (${slowest_jar_total_ms} ms total across ${slowest_jar_count} spans)"
            echo "- Slowest class: ${slowest_class_id} (${slowest_class_total_ms} ms total across ${slowest_class_count} spans)"
            echo "- Investigation:"
            echo "  - Screenshot evidence: Captured after a best-effort timeline collapse attempt in Jaeger UI."
            echo "  - Trace evidence: Slowest rule/jar/class are extracted from aggregated span durations in ${summary_json}."
            echo "  - Next action: Prioritize optimization in the slowest rule, then verify jar/class-level impact in the next run."
          } > "${report_md}"

          {
            echo "trace_id=${trace_id}"
            echo "trace_json=${trace_json}"
            echo "screenshot_png=${screenshot_png}"
            echo "summary_json=${summary_json}"
            echo "report_md=${report_md}"
          } >> "${GITHUB_OUTPUT}"
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jaeger-spotbugs-benchmark
          path: |
            target/bench/bench-workflow.log
            target/bench/spotbugs.log
            target/bench/analyze-trace.log
            target/bench/benchmark-report.md
            target/bench/jaeger-trace-*.json
            target/bench/jaeger-trace-*.summary.json
            target/bench/jaeger-trace-*.png
            target/bench/jaeger-debug/*
          if-no-files-found: error
      - name: Read release PR number
        id: resolve-pr
        if: needs.release-please.outputs.prs_created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pr_number='${{ fromJSON(needs.release-please.outputs.pr).number }}'
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
      - name: Publish screenshot for PR comment
        id: screenshot-image
        if: steps.resolve-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ASSET_BRANCH: codex/benchmark-screenshots
          SCREENSHOT_PNG: ${{ steps.bench.outputs.screenshot_png }}
          TRACE_ID: ${{ steps.bench.outputs.trace_id }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${work_dir}"

          pushd "${work_dir}" >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${ASSET_BRANCH}" >/dev/null 2>&1 || true
          if git show-ref --verify --quiet "refs/remotes/origin/${ASSET_BRANCH}"; then
            git checkout -B "${ASSET_BRANCH}" "origin/${ASSET_BRANCH}"
          else
            git checkout -B "${ASSET_BRANCH}"
          fi

          screenshot_src="${GITHUB_WORKSPACE}/${SCREENSHOT_PNG}"
          if [[ ! -f "${screenshot_src}" ]]; then
            echo "Screenshot file not found: ${screenshot_src}"
            exit 1
          fi

          screenshot_name="jaeger-trace-${TRACE_ID}-run${GITHUB_RUN_ID}.png"
          asset_path=".github/benchmark-assets/${screenshot_name}"
          mkdir -p "$(dirname "${asset_path}")"
          cp "${screenshot_src}" "${asset_path}"

          git add "${asset_path}"
          if git diff --cached --quiet; then
            echo "Screenshot image is unchanged."
          else
            git commit -m "chore(ci): add benchmark screenshot for run ${GITHUB_RUN_ID}"
            git push -u origin "${ASSET_BRANCH}"
          fi
          popd >/dev/null

          screenshot_image_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ASSET_BRANCH}/${asset_path}"
          echo "screenshot_image_url=${screenshot_image_url}" >> "${GITHUB_OUTPUT}"
      - name: Post benchmark report to release PR
        if: steps.resolve-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          TRACE_ID: ${{ steps.bench.outputs.trace_id }}
          TRACE_JSON: ${{ steps.bench.outputs.trace_json }}
          SCREENSHOT_PNG: ${{ steps.bench.outputs.screenshot_png }}
          SCREENSHOT_IMAGE_URL: ${{ steps.screenshot-image.outputs.screenshot_image_url }}
          SUMMARY_JSON: ${{ steps.bench.outputs.summary_json }}
          REPORT_MD: ${{ steps.bench.outputs.report_md }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          marker="<!-- jaeger-spotbugs-benchmark -->"
          comment_md="target/bench/pr-comment.md"
          {
            echo "${marker}"
            echo "## Jaeger SpotBugs Benchmark"
            echo
            cat "${REPORT_MD}"
            echo
            echo "- Trace JSON: \`${TRACE_JSON}\`"
            echo "- Summary JSON: \`${SUMMARY_JSON}\`"
            echo "- Screenshot: \`${SCREENSHOT_PNG}\`"
            echo "- Screenshot URL: ${SCREENSHOT_IMAGE_URL}"
            echo "- Workflow artifacts: [Run ${GITHUB_RUN_ID}](${run_url})"
            echo
            echo "![Jaeger trace screenshot](${SCREENSHOT_IMAGE_URL})"
          } > "${comment_md}"

          comment_json="target/bench/pr-comment.json"
          jq -n --rawfile body "${comment_md}" '{body: $body}' > "${comment_json}"

          existing_comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.body | contains("<!-- jaeger-spotbugs-benchmark -->")) | .id' \
              | tail -n 1
          )"

          if [[ -n "${existing_comment_id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
              --input "${comment_json}" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input "${comment_json}" >/dev/null
          fi
      - name: Upload trace and screenshot to GitHub Release
        if: needs.release-please.outputs.rust_release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.rust_tag_name }}
          TRACE_JSON: ${{ steps.bench.outputs.trace_json }}
          SUMMARY_JSON: ${{ steps.bench.outputs.summary_json }}
          SCREENSHOT_PNG: ${{ steps.bench.outputs.screenshot_png }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${TAG_NAME}" "${TRACE_JSON}" "${SUMMARY_JSON}" "${SCREENSHOT_PNG}" --clobber

  benchmark-nullness-docs:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - name: Resolve target release PR
        id: target-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PLEASE_PR: ${{ needs.release-please.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PLEASE_PR}" && "${RELEASE_PLEASE_PR}" != "null" ]]; then
            pr_number="$(
              jq -r '.number // empty' <<<"${RELEASE_PLEASE_PR}"
            )"
            head_ref="$(
              jq -r '.headBranchName // empty' <<<"${RELEASE_PLEASE_PR}"
            )"

            if [[ -n "${pr_number}" && -n "${head_ref}" ]]; then
              echo "skip=false" >> "${GITHUB_OUTPUT}"
              echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
              echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "release-please pr output was present but incomplete; falling back to branch lookup."
          fi

          head_ref="release-please--branches--main"
          pr_number="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${head_ref}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -z "${pr_number}" ]]; then
            echo "No open Rust release-please PR found; skipping benchmark docs refresh."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"
      - name: Checkout release PR branch
        if: steps.target-pr.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The initial app token expires during the long-running benchmark.
          # Push uses a fresh token later in the job, so checkout must not persist credentials.
          persist-credentials: false
          ref: ${{ steps.target-pr.outputs.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: steps.target-pr.outputs.skip != 'true'
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Rust
        if: steps.target-pr.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.target-pr.outputs.skip != 'true'
      - name: Install benchmark dependencies
        if: steps.target-pr.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y hyperfine maven
      - name: Run nullness benchmark
        if: steps.target-pr.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bench-nullness-compare.sh --dataset all --min-runs 5 --warmup 1
      - name: Render performance docs
        if: steps.target-pr.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/render-performance-docs.sh
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: steps.target-pr.outputs.skip != 'true'
        id: app-token-push
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - name: Commit and push benchmark docs
        if: steps.target-pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-push.outputs.token }}
          HEAD_REF: ${{ steps.target-pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/performance.md docs/benchmarks/*.json
          if git diff --cached --quiet; then
            echo "No benchmark doc changes to commit."
            exit 0
          fi
          git commit -m "chore(bench): refresh nullness performance docs"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${HEAD_REF}"

  publish-rust-github-release:
    runs-on: ubuntu-latest
    needs:
      - release-please
      - build-release-binaries
      - benchmark-release-jaeger
    if: needs.release-please.outputs.rust_release_created == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout verification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download final CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cli-release-*
          merge-multiple: true
          path: release
      - name: Verify, upload and publish Rust draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.rust_tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.rust_sha }}
        shell: bash
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $TAG_NAME must be a draft before uploading archives."
            exit 1
          fi

          bash scripts/verify-cli-release.sh release "$TAG_NAME" "$RELEASE_SHA"
          gh release upload "$TAG_NAME" release/*.tar.gz release/*.zip --clobber

          # Verify the bytes served to consumers before making the draft public.
          mkdir published
          gh release download "$TAG_NAME" --dir published --pattern '*.tar.gz' --pattern '*.zip'
          bash scripts/verify-cli-release.sh published "$TAG_NAME" "$RELEASE_SHA"
          gh release edit "$TAG_NAME" --draft=false

  publish-crates:
    runs-on: ubuntu-latest
    environment: release
    needs:
      - release-please
      - publish-rust-github-release
    if: needs.release-please.outputs.rust_release_created == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.rust_sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked

  build-gradle-plugin:
    needs: release-please
    if: needs.release-please.outputs.gradle_plugin_release_created == 'true'
    uses: ./.github/workflows/build-gradle-release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      release-tag: ${{ needs.release-please.outputs.gradle_plugin_tag_name }}
      release-sha: ${{ needs.release-please.outputs.gradle_plugin_sha }}

  publish-gradle-plugin:
    runs-on: ubuntu-latest
    environment: release
    needs:
      - release-please
      - build-gradle-plugin
    if: needs.release-please.outputs.gradle_plugin_release_created == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true
      - name: Restore attested publication files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: gradle-release
          path: gradle-plugin/build
      - name: Publish plugin to Gradle Plugin Portal
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.gradle_plugin_tag_name }}
          GRADLE_PUBLISH_KEY: ${{ vars.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          ./gradlew publishPlugins --no-daemon --no-configuration-cache \
            -PverifyRelease \
            -PpluginVersion="${RELEASE_TAG#gradle-plugin-v}"
        working-directory: gradle-plugin
      - name: Upload reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gradle-plugin-reports
          path: gradle-plugin/build/reports
          if-no-files-found: warn

  publish-gradle-github-release:
    runs-on: ubuntu-latest
    needs:
      - release-please
      - publish-gradle-plugin
    if: needs.release-please.outputs.gradle_plugin_release_created == 'true'
    permissions:
      contents: write
    steps:
      - name: Publish Gradle plugin draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.gradle_plugin_tag_name }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $TAG_NAME must be a draft before publication."
            exit 1
          fi
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
