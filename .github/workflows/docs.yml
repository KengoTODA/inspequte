name: Docs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
      - name: Install MkDocs
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Validate Rule Specs
        run: bash scripts/validate-rule-specs.sh
      - name: Generate Rule Docs
        run: bash scripts/generate-rule-docs.sh
      - name: Copy JSON Schemas
        run: bash scripts/copy-json-schemas.sh
      - name: Build MkDocs Site
        run: mkdocs build --strict
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0
      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
