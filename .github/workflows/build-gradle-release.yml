name: Build and attest Gradle plugin release

on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      release-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_SHA: ${{ inputs.release-sha }}
        run: bash scripts/validate-release-source.sh gradle "$RELEASE_TAG" "$RELEASE_SHA"
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-disabled: true
      - name: Prepare final publication files
        working-directory: gradle-plugin
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          ./gradlew clean prepareReleaseArtifacts --no-daemon --no-configuration-cache \
            -PpluginVersion="${RELEASE_TAG#gradle-plugin-v}"
      - name: Transfer publication files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gradle-release
          path: gradle-plugin/build/release-artifacts/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download files from this builder
        uses: actions/download-artifact@v8.0.2
        with:
          name: gradle-release
          path: release
      - name: Attest publication files
        uses: actions/attest@v4.2.2
        with:
          subject-path: release/**/*
          # Storage records are for OCI images, not these publication files.
          create-storage-record: false
